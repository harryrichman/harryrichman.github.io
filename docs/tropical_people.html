        // Populate list of people
        const peopleList = document.getElementById("people-list");

        tropicalPeople.forEach(person => {
            const listItem = document.createElement("li");
            listItem.innerHTML = `<button id="${person.name.replaceAll(" ","")}-button">🌎</button> <a href="${person.site}">${person.name}</a>`;
            peopleList.appendChild(listItem);
        });

        const peopleListTemp = document.getElementById("people-early-list");
        tropicalPeopleTemp.forEach(person => {
            const listItem = document.createElement("li");
            listItem.innerHTML = `<button id="${person.name.replaceAll(" ","")}-button">🌎</button> <a href="${person.site}">${person.name}</a>`;
            peopleListTemp.appendChild(listItem);
        });

        // Create red marker icon
        const redIcon = new L.Icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });
        // Create green marker icon
        const greenIcon = new L.Icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });
        // Create yellow marker icon
        const yellowIcon = new L.Icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-yellow.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        let locationsMap = null;

      function initializeMap() {
        if (!locationsMap) {
          // Create map with proper wrapping options
          locationsMap = L.map('map', {
            worldCopyJump: false,  // Enable proper wrapping behavior
            maxBoundsViscosity: 1.0  // Ensure smooth scrolling at edges
          }).setView([25.0174, 151.5431], 2); // Initialize centered east of Taipei

          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors',
            referrerPolicy: 'strict-origin-when-cross-origin',
          }).addTo(locationsMap);


          // Add markers for people with temporary positions
          tropicalPeopleTemp.forEach(person => {
            // Create marker with wrapped coordinates
            const wrappedLatLng = L.latLng(person.lat, person.lng, true);  // true enables wrapping
            const marker = L.marker(wrappedLatLng, {
              icon: greenIcon,
              // Enable marker wrapping
              wrapAroundAntimeridian: false,
              // Make the marker stay on top
              zIndexOffset: 1000,
            });

            // Create styled popup content
            let popupContent = `
              <div style="font-family: Arial, sans-serif;">
                <div style="font-weight: 500;">${person.name}
                <abbr style="color: #666; font-size: 0.9em; margin-top: 2px;">
                    <a href=${person.site}>web</a>
                </abbr></div>
                <div style="color: #666; font-size: 0.9em; margin-top: 4px;">
                  ${person.inst}
                </div>
              </div>
            `;

            // Show popup when map-button next to list name is clicked
            document.getElementById(`${person.name.replaceAll(" ", "")}-button`).addEventListener("click", function () {
                marker.openPopup();
            });

            // Add popup with location info
            marker.bindPopup(popupContent);

            // Add marker to map
            marker.addTo(locationsMap);
          });

          // Combine people by institution
          var tropicalPlaces = [];
          var tropicalPlaceData = {};
          tropicalPeople.forEach(person => {
            const inst = person.inst;
            if (tropicalPlaces.includes(inst)) {
                // console.log("skip: " + inst);
                tropicalPlaceData[inst].people.push(person);
            } else {
                tropicalPlaces.push(person.inst);
                tropicalPlaceData[inst] = {people: []};
                tropicalPlaceData[inst].people.push(person);
                tropicalPlaceData[inst].lat = person.lat;
                tropicalPlaceData[inst].lng = person.lng;
            }
          });
        

          // Add marker for each place
          Object.keys(tropicalPlaceData).forEach(place => {
            const placeData = tropicalPlaceData[place];
            // Create marker
            const latLng = L.latLng(placeData.lat, placeData.lng, false);  
            const marker = L.marker(latLng, {
              icon: yellowIcon,
              // Enable marker wrapping
            //   wrapAroundAntimeridian: false,
              // Make the marker stay on top
              zIndexOffset: 1000 * placeData.people.length,
            });
            // Create styled popup content
            let popupContent = `<div style="font-family: Arial, sans-serif;">`;
            placeData.people.forEach(person => {
              popupContent += `
                <div style="font-weight: 500; margin-top: 4px;">${person.name}
                <abbr style="color: #666; font-size: 0.9em;">
                    <a href=${person.site}>web</a>
                </abbr></div>
              `;
            }),
            popupContent += `
                <div style="color: #666; font-size: 0.9em; margin-top: 4px;">
                  ${place}
                </div>
              </div>
            `;

            // Add popup with location info
            marker.bindPopup(popupContent);

            // Add marker to map
            marker.addTo(locationsMap);

            // Show popup when map-button next to list name is clicked
            placeData.people.forEach(person => {
                document.getElementById(`${person.name.replaceAll(" ", "")}-button`).addEventListener("click", function () {
                    marker.openPopup();
                });
            });

          });

          // Add move end handler to ensure markers stay visible
          locationsMap.on('moveend', () => {
            locationsMap.eachLayer((layer) => {
              if (layer instanceof L.Marker) {
                const pos = layer.getLatLng();
                layer.setLatLng(pos, { wrap: true });  // Re-wrap coordinates after movement
              }
            });
          });
        }

        // Handle map resize when tab becomes visible
        // setTimeout(() => {
        //   locationsMap.invalidateSize();
        //   // Adjust bounds to show all markers
        //   const bounds = L.latLngBounds(conferenceLocations.map(loc => [loc.lat, loc.lng]));
        //   locationsMap.fitBounds(bounds, { padding: [50, 50] });
        // }, 250);
      }

      initializeMap();
    </script>
